[build]
  publish = "."
  functions = "netlify/functions"
  command = "node scripts/v5-safe-build.cjs"

[[redirects]]
  from = "/api/v1/snapshot"
  to = "/.netlify/functions/snapshot"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

[[redirects]]
  from = "/api/v5/evidence"
  to = "/.netlify/functions/v5-evidence"
  status = 200
  force = true
