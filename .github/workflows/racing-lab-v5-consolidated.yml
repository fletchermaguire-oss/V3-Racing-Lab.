name: Racing Lab V5 - Saturday Read-only Source QA
on:
  schedule:
    # Brisbane Saturday 06:30, 07:00, 07:20, 07:30: reachability checks only
    - cron: '30 20 * * 5'
    - cron: '0 21 * * 5'
    - cron: '20 21 * * 5'
    - cron: '30 21 * * 5'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: racing-lab-v5-source-audit
  cancel-in-progress: false
jobs:
  race-day:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Report only source reachability and board approval (no rankings or locks)
        env:
          SCHEDULE: "${{ github.event.schedule }}"
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const parts=new Intl.DateTimeFormat('en-CA',{
            timeZone:'Australia/Brisbane',weekday:'short',year:'numeric',month:'2-digit',day:'2-digit'
          }).formatToParts(new Date());
          const t=Object.fromEntries(parts.map(x=>[x.type,x.value]));
          const day=t.year+'-'+t.month+'-'+t.day;
          const report={
            schema_version:2,checked_at_utc:new Date().toISOString(),brisbane_date:day,
            stage:process.env.SCHEDULE||'manual',status:'SOURCE_REACHABILITY_ONLY',
            read_only:true,official_fields_verified:false,actual_scratchings_downloaded:false,
            note:'Checking reachability cannot certify scratching sheets, final starters, approval, a live site update or a legitimate pre-race lock.',
            sources:[],issues:[]
          };
          async function run(){
            const sources=[
              ['Racing Australia scratchings','https://www.racingaustralia.horse/FreeFields/Scratchings.aspx'],
              ['Racing Queensland open data','https://www.racingqueensland.com.au/about/reports-and-data/open-data'],
              ['Bureau of Meteorology','https://www.bom.gov.au/']
            ];
            for(const [name,url] of sources){
              try{
                const res=await fetch(url,{signal:AbortSignal.timeout(9000),
                  headers:{'User-Agent':'RacingLabResearch/1.0'}});
                report.sources.push({name,http_status:res.status,reachable:res.ok});
              }catch(e){report.sources.push({name,reachable:false,error:String(e.message)});}
            }
            try{
              const board=JSON.parse(fs.readFileSync('published-board.json','utf8'));
              const p=board.publication||{};
              report.board={published:p.status==='PUBLISHED',reviewed:p.reviewed===true,
                frozen:p.frozen===true,for_today:p.date===day};
              if(!report.board.published||!report.board.reviewed||!report.board.frozen)
                report.issues.push('Board is not an approved frozen pre-race publication');
            }catch(e){report.issues.push('Cannot inspect board: '+e.message);}
            if(t.weekday!=='Sat')report.issues.push('Not Brisbane Saturday');
            fs.writeFileSync('racing-lab-v5-report.json',JSON.stringify(report,null,2)+'\n');
            console.log(JSON.stringify(report,null,2));
          }
          run().catch(e=>{
            report.status='SOURCE_AUDIT_FAILED';report.issues.push(String(e.message||e));
            fs.writeFileSync('racing-lab-v5-report.json',JSON.stringify(report,null,2)+'\n');
            console.error(e);process.exitCode=1;
          });
          NODE
      - name: Upload read-only source QA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: racing-lab-v5-report
          path: racing-lab-v5-report.json
          if-no-files-found: warn
