name: Formula and site QA
on:
  push:
    branches: [main, 'codex/v5-formula-integrity-20261030']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm run check
      - run: npm run research:audit
      - run: npm run research:class
      - run: git diff --exit-code
