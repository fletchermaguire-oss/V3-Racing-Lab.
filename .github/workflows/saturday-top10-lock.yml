name: Saturday Top 10 pre-race lock
on:
  schedule:
    # Friday 21:30 UTC = Saturday 07:30 Australia/Brisbane (UTC+10, no DST)
    - cron: '30 21 * * 5'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: saturday-top10-lock
  cancel-in-progress: false
jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate and lock published board
        run: node scripts/lock-top10.cjs
      - name: Commit immutable snapshot if created
        run: |
          if [[ -n "$(git status --porcelain -- locked-selections/)" ]]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add locked-selections/
            git commit -m "Lock Saturday Top 10 pre-race selections"
            git push
          else
            echo 'No new snapshot to commit.'
          fi
