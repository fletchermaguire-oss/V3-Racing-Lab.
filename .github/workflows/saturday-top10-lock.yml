name: Saturday approved pre-race lock (manual only)
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: saturday-top10-lock
  cancel-in-progress: false
jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify model and research audit
        run: |
          npm test
          npm run check
          npm run research:audit
      - name: Lock only explicitly approved, independently ranked pre-race selections
        run: node scripts/lock-top10.cjs
      - name: Commit pre-race lock without modifying research selections or published board
        shell: bash
        run: |
          if [[ -n "$(git status --porcelain -- locked-selections/)" ]]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add locked-selections/
            git commit -m 'Record explicitly approved Saturday pre-race selection lock'
            git push
          else
            echo 'No new snapshot to commit.'
          fi
