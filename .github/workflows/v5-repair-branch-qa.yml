name: V5 repair branch regression (no deploy)
on:
  push:
    branches: ['fix/v5-engine-readiness-20261110']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm run check
      - run: npm run research:audit
      - run: npm run research:class
      - run: git diff --exit-code
