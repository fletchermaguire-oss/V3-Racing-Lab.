name: V5 repair branch regression (no deploy)
on:
  push:
    branches: ['fix/v5-engine-readiness-20261110']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm run check
      - run: npm run research:audit
      - run: npm run research:class
      - run: node v5/experiments/venue-open-shadow.cjs > /tmp/v5-regional-open.json && node -e "const x=require('/tmp/v5-regional-open.json'); console.log(JSON.stringify(x.scenarios.map(s=>({alpha:s.alpha,top1:s.top1,top3:s.top3,top5:s.top5,brier:s.brier,log_loss:s.log_loss,gains:s.gains,harms:s.harms,flips:s.flips.length,affected_races:s.affected_races}))))"
      - run: node v5/experiments/pace-flip-audit.cjs > /tmp/v5-pace-flips.json && node -e "const x=require('/tmp/v5-pace-flips.json');console.log(JSON.stringify({days:x.days,changes:x.leader_changes,gains:x.gained_winners,harms:x.lost_winners,both_wrong:x.switched_between_losers,beneficial:x.beneficial_flips,harmful:x.harmful_flips}))"
      - run: node v5/experiments/audit-opposition-coverage.cjs > /tmp/v5-opposition-audit.json && node -e "const a=require('/tmp/v5-opposition-audit.json'); console.log(JSON.stringify({total:a.runner_entries,linked:a.linked_rating_entries,dates:a.dates}))"
      - run: node v5/experiments/leader-reliability-shadow.cjs > /tmp/v5-reliability.json && node -e "const x=require('/tmp/v5-reliability.json'); console.log(JSON.stringify({sample:x.totals,by_day:x.dates.map(d=>({date:d.date,baseline:d.baseline,screens:d.screens,leaderboard:d.leaderboard}))}))"
      - run: node -e "const a=require('./v5/experiments/2026-11-14-selection-rule-preregistration.json');const x=require('child_process').execFileSync('git',['hash-object','v5/experiments/leader-reliability-shadow.cjs'],{encoding:'utf8'}).trim();if(x!==a.reliability_script_git_blob_sha)process.exit(1);console.log('FROZEN_SELECTIVE_RULE',x)"
      - run: node -e "const a=require('./v5/experiments/leader-reliability-shadow.cjs').evaluate();console.log(JSON.stringify({strict:a.totals.screens.strict_winfirst,top5:a.totals.leaderboard.top5.swaps.map(x=>({date:x.date,added:x.additional_winners,lost:x.removed_winners,net:x.net_wins})),top10:a.totals.leaderboard.top10.swaps.map(x=>({date:x.date,added:x.additional_winners,lost:x.removed_winners,net:x.net_wins})),top15:a.totals.leaderboard.top15.swaps.map(x=>({date:x.date,added:x.additional_winners,lost:x.removed_winners,net:x.net_wins}))}))"
      - run: node v5/experiments/feature-ablation-shadow.cjs > /tmp/v5-ablation.json && node -e "const a=require('/tmp/v5-ablation.json');console.log(JSON.stringify({baseline:a.baseline,runs:a.runs.map(r=>({feature:r.feature,scale:r.scale,top1:r.top1,top3:r.top3,top5:r.top5,brier:r.brier,log_loss:r.log_loss,flips:r.flips,gains:r.gains,harms:r.harms,by_date:r.dates.map(d=>({date:d.date,top1:d.top1,gains:d.gains,harms:d.harms}))}))}))"
      - run: git diff --exit-code
