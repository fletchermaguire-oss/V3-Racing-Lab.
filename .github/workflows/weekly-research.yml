
name: Racing Lab Weekly Research

on:
  workflow_dispatch:
  schedule:
    - cron: "0 21 * * 4"
    - cron: "0 20 * * 5"

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Import verified racing evidence
        env:
          AIRTABLE_PAT: ${{ secrets.AIRTABLE_PAT }}
          RACING_DATA_JSON_URL: ${{ vars.RACING_DATA_JSON_URL }}
        run: python scripts/weekly_pipeline.py

      - name: Save research audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-racing-research
          path: generated/weekly-research.json
          if-no-files-found: ignore
